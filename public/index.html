<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <title>Tehtävälista</title>
  </head>
  <body>
    <h1>Tehtävälista</h1>
    <form id="task-form">
      <label for="task">Uusi tehtävä</label>
      <input id="task" name="task" type="text" />
      <button type="submit">Lisää</button>
    </form>
    <p id="message"></p>
    <h2>Tehtävät</h2>
    <ul id="task-list"></ul>
    <script src="script.js"></script>
  </body>
</html>
